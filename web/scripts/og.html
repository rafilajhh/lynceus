<!doctype html>
<!--
  Source of web/public/og.png (1200×630 link-preview card). Tokens from
  DESIGN.md: graphite ground, hairline seams, IBM Plex, one amber accent,
  verdict colours for meaning only. Re-render with a headless browser at a
  1200×630 viewport and screenshot the page.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --ground: #0a0c10; --panel: #0e1116; --raised: #161b23;
    --seam: #1c2128; --seam-strong: #2a323d;
    --ink: #e8eaed; --muted: #9aa3ad; --faint: #7d8899;
    --amber: #f5a623; --green: #2ecc71; --red: #e74c3c;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: var(--ground); }
  body {
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    padding: 56px 72px 48px; display: flex; flex-direction: column;
    border-top: 6px solid var(--amber);
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 64px; height: 64px; }
  .word { font-size: 34px; font-weight: 700; letter-spacing: 6px; text-transform: uppercase; }
  h1 {
    margin-top: 56px; font-size: 66px; line-height: 1.06; font-weight: 700;
    letter-spacing: -0.015em; max-width: 15ch;
  }
  .sub {
    margin-top: 26px; font-size: 25px; line-height: 1.45; color: var(--muted); max-width: 46ch;
  }
  .sub b { color: var(--ink); font-weight: 600; }
  .foot {
    margin-top: auto; padding-top: 28px; border-top: 1px solid var(--seam-strong);
    display: flex; align-items: center; justify-content: space-between;
  }
  .pills { display: flex; gap: 14px; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px; border-radius: 999px;
    border: 1.5px solid; padding: 9px 20px; font-size: 19px; font-weight: 700; letter-spacing: 1.5px;
  }
  .pill i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .accept { color: var(--green); border-color: rgba(46,204,113,.45); background: rgba(46,204,113,.14); }
  .escalate { color: var(--amber); border-color: rgba(245,166,35,.45); background: rgba(245,166,35,.14); }
  .reject { color: var(--red); border-color: rgba(231,76,60,.45); background: rgba(231,76,60,.14); }
  .url { font-size: 20px; color: var(--faint); }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 256 256" aria-hidden="true">
      <path fill="none" stroke="#e8eaed" stroke-width="20" stroke-linecap="round"
            d="M36 128C68 82 100 66 128 66s60 16 92 62c-32 46-60 62-92 62s-60-16-92-62z"/>
      <rect x="104" y="104" width="48" height="48" fill="#f5a623"/>
    </svg>
    <span class="word">Lynceus</span>
  </div>
  <h1>AI gate inspector for RDF fuel trucks</h1>
  <p class="sub">
    <b>Vision model on AMD Token Factory</b> + <b>CPU detector</b> second opinion
    → one verdict per truck, sealed to an audit record.
  </p>
  <div class="foot">
    <div class="pills">
      <span class="pill accept"><i></i>ACCEPT</span>
      <span class="pill escalate"><i></i>ESCALATE</span>
      <span class="pill reject"><i></i>REJECT</span>
    </div>
    <span class="url mono">lynceus.web.id</span>
  </div>
</body>
</html>
