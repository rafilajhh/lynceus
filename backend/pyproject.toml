[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lynceus-backend"
version = "0.1.0"
description = "Lynceus backend: FastAPI service wrapping the Lynceus decision engine."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lynceus*", "lynceus_engine*"]
[tool.pytest.ini_options]
markers = [
    "live: live smoke tests against a real endpoint (opt-in via LYNCEUS_LIVE_TESTS=1)",
]
