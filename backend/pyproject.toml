[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lynceus-backend"
version = "0.1.0"
description = "Lynceus backend: FastAPI service wrapping the Lynceus decision engine."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "httpx",
    # CPU detector second opinion (lynceus.detector); without them it is off.
    # Floors are the versions the bundled model and the tests were run with.
    "onnxruntime>=1.31.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lynceus*", "lynceus_engine*"]

[tool.setuptools.package-data]
lynceus = ["knowledge/*.md"]

[tool.pytest.ini_options]
markers = [
    "live: live smoke tests against a real endpoint (opt-in via LYNCEUS_LIVE_TESTS=1)",
]
